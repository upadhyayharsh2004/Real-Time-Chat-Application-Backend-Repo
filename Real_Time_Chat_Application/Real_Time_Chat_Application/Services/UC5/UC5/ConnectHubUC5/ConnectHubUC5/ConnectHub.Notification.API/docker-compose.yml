version: '3.8'
services:
  connecthub-notification-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connecthub-notification-api
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__NotificationDb=Server=sqlserver,1433;Database=ConnectHub_Notification;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;
      - Jwt__Secret=ConnectHub_Super_Secret_JWT_Key_2026_Change_This_In_Production_MinLength32
      - Jwt__Issuer=ConnectHub
      - Jwt__Audience=ConnectHubUsers
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Email__Enabled=false
      - SEQ_URL=http://seq:5341
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - connecthub-network
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: connecthub-sqlserver-notification
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1436:1433"
    networks:
      - connecthub-network
  rabbitmq:
    image: rabbitmq:3-management
    container_name: connecthub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - connecthub-network
  seq:
    image: datalust/seq:latest
    container_name: connecthub-seq-notification
    ports:
      - "5344:5341"
      - "8084:80"
    environment:
      ACCEPT_EULA: Y
    networks:
      - connecthub-network
networks:
  connecthub-network:
    driver: bridge
