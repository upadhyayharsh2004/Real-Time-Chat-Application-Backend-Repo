version: '3.8'

# NOTE: UC3 connects to the SAME RabbitMQ broker started by UC1.
# Run UC1 docker-compose first (or use a shared root compose).
# UC1 exposes RabbitMQ on host port 5672.

services:
  connecthub-chatroom-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connecthub-chatroom-api
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ChatRoomDb=Server=sqlserver,1433;Database=ConnectHub_ChatRoom;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;
      - Jwt__Secret=ConnectHub_Super_Secret_JWT_Key_2026_Change_This_In_Production_MinLength32
      - Jwt__Issuer=ConnectHub
      - Jwt__Audience=ConnectHubUsers
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__VHost=/
      - SEQ_URL=http://seq:5341
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - connecthub-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: connecthub-chatroom-sqlserver
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    networks:
      - connecthub-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: connecthub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - connecthub-network

  seq:
    image: datalust/seq:latest
    container_name: connecthub-seq-chatroom
    ports:
      - "5342:5341"
      - "8082:80"
    environment:
      ACCEPT_EULA: Y
    networks:
      - connecthub-network

networks:
  connecthub-network:
    driver: bridge
